<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1600">
  <!-- Title -->
  <text x="900" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">
    Database ER Diagram - Knowledge Extraction System
  </text>
  <text x="900" y="55" text-anchor="middle" font-size="14" fill="#666">
    PostgreSQL with pgvector | 10 Tables: 1 Shared + 9 Book-Specific (2 Raw + 7 Processed) | + Chroma DB (Vector Storage)
  </text>

  <!-- Legend -->
  <g transform="translate(1480, 80)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#333">Legend:</text>
    <rect x="0" y="10" width="20" height="15" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2"/>
    <text x="25" y="22" font-size="12" fill="#333">Shared Table</text>
    <rect x="0" y="35" width="20" height="15" fill="#FFB84D" stroke="#E69500" stroke-width="2"/>
    <text x="25" y="47" font-size="12" fill="#333">Raw Data (OCR)</text>
    <rect x="0" y="60" width="20" height="15" fill="#7ED321" stroke="#5A9818" stroke-width="2"/>
    <text x="25" y="72" font-size="12" fill="#333">Processed Data</text>
    <rect x="0" y="85" width="20" height="15" fill="#9B59B6" stroke="#6C3483" stroke-width="2"/>
    <text x="25" y="97" font-size="12" fill="#333">Vector Database</text>
    <line x1="0" y1="110" x2="20" y2="110" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="25" y="115" font-size="12" fill="#333">Foreign Key</text>
    <line x1="0" y1="125" x2="20" y2="125" stroke="#9B59B6" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>
    <text x="25" y="130" font-size="12" fill="#333">Data Sync</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#E74C3C" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9B59B6" />
    </marker>
  </defs>

  <!-- 1. books_metadata (Shared Table - Center Top) -->
  <g transform="translate(650, 100)">
    <rect width="500" height="280" fill="#4A90E2" stroke="#2E5C8A" stroke-width="3" rx="8"/>
    <rect width="500" height="40" fill="#2E5C8A" rx="8"/>
    <text x="250" y="27" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
      books_metadata (SHARED)
    </text>
    <text x="10" y="60" font-size="13" font-weight="bold" fill="white">PK: book_id</text>
    <text x="10" y="80" font-size="12" fill="white">book_name, sanitized_name, table_prefix</text>
    <text x="10" y="95" font-size="12" fill="white">file_type, file_size_bytes, total_pages</text>
    <text x="10" y="110" font-size="12" fill="white">processing_status, current_page, language</text>
    <text x="10" y="125" font-size="12" fill="white">total_knowledge_units, total_images</text>
    <text x="10" y="140" font-size="12" fill="white">verified_units, verified_percentage</text>
    <text x="10" y="155" font-size="12" fill="white">upload_date, processing_started_at</text>
    <text x="10" y="170" font-size="12" fill="white">processing_completed_at, last_updated_at</text>
    <text x="10" y="190" font-size="11" font-style="italic" fill="white">Central registry of all books in system</text>
    <text x="10" y="210" font-size="11" font-weight="bold" fill="white">Creates 9 book-specific tables:</text>
    <text x="10" y="230" font-size="10" fill="white">- 2 Raw Tables: raw_pages, raw_knowledge_units</text>
    <text x="10" y="245" font-size="10" fill="white">- 7 Processed: knowledge_units, pages, images, ...</text>
  </g>

  <!-- RAW DATA TABLES SECTION -->
  <text x="100" y="450" font-size="16" font-weight="bold" fill="#E69500">RAW DATA TABLES (OCR Input/Output)</text>

  <!-- 2. raw_pages (Raw - Left Top) -->
  <g transform="translate(50, 480)">
    <rect width="350" height="210" fill="#FFB84D" stroke="#E69500" stroke-width="3" rx="8"/>
    <rect width="350" height="40" fill="#E69500" rx="8"/>
    <text x="175" y="27" text-anchor="middle" font-size="15" font-weight="bold" fill="white">
      raw_book{N}_{name}_pages
    </text>
    <text x="10" y="60" font-size="12" font-weight="bold" fill="white">PK: id</text>
    <text x="10" y="78" font-size="11" fill="white">page_number (unique)</text>
    <text x="10" y="93" font-size="11" fill="white">original_image_data (BYTEA, LZ4 compressed)</text>
    <text x="10" y="108" font-size="11" fill="white">original_format (PNG, JPEG)</text>
    <text x="10" y="123" font-size="11" fill="white">original_width, original_height</text>
    <text x="10" y="138" font-size="11" fill="white">original_size_bytes</text>
    <text x="10" y="153" font-size="11" fill="white">chapter, topic, sub_topic</text>
    <text x="10" y="168" font-size="11" fill="white">created_at, updated_at</text>
    <text x="10" y="185" font-size="10" font-style="italic" fill="white">Stores original page images (OCR input)</text>
    <text x="10" y="200" font-size="10" font-style="italic" fill="white">+ Document hierarchy fields</text>
  </g>

  <!-- 3. raw_knowledge_units (Raw - Right Top) -->
  <g transform="translate(450, 480)">
    <rect width="380" height="240" fill="#FFB84D" stroke="#E69500" stroke-width="3" rx="8"/>
    <rect width="380" height="40" fill="#E69500" rx="8"/>
    <text x="190" y="27" text-anchor="middle" font-size="15" font-weight="bold" fill="white">
      raw_book{N}_{name}_knowledge_units
    </text>
    <text x="10" y="60" font-size="12" font-weight="bold" fill="white">PK: id</text>
    <text x="10" y="78" font-size="11" fill="white">FK: raw_page_id -&gt; raw_pages</text>
    <text x="10" y="93" font-size="11" fill="white">page_number</text>
    <text x="10" y="108" font-size="11" fill="white">ocr_engine (paddleocr, surya, tesseract)</text>
    <text x="10" y="123" font-size="11" fill="white">ocr_run_timestamp</text>
    <text x="10" y="138" font-size="11" fill="white">full_page_text (TEXT - UNSPLIT)</text>
    <text x="10" y="153" font-size="11" fill="white">text_length, confidence_score</text>
    <text x="10" y="168" font-size="11" fill="white">language, extracted_image_ids (array)</text>
    <text x="10" y="183" font-size="11" fill="white">created_at, updated_at</text>
    <text x="10" y="205" font-size="10" font-style="italic" fill="white">Full page OCR text before splitting</text>
    <text x="10" y="220" font-size="10" font-style="italic" fill="white">(3 records per page: PaddleOCR, Surya, Tesseract)</text>
  </g>

  <!-- FK: raw_knowledge_units -> raw_pages -->
  <path d="M 450,560 L 420,560 L 420,570 L 400,570"
        stroke="#E74C3C" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="430" y="558" font-size="9" fill="#E74C3C">raw_page_id</text>

  <!-- PROCESSED DATA TABLES SECTION -->
  <text x="900" y="450" font-size="16" font-weight="bold" fill="#5A9818">PROCESSED DATA TABLES (Split/Verified)</text>

  <!-- 4. knowledge_units (Processed - Right Middle) -->
  <g transform="translate(900, 480)">
    <rect width="370" height="370" fill="#7ED321" stroke="#5A9818" stroke-width="3" rx="8"/>
    <rect width="370" height="40" fill="#5A9818" rx="8"/>
    <text x="185" y="27" text-anchor="middle" font-size="15" font-weight="bold" fill="white">
      book{N}_{name}_knowledge_units
    </text>
    <text x="10" y="60" font-size="12" font-weight="bold" fill="white">PK: id</text>
    <text x="10" y="78" font-size="11" fill="white">FK: raw_knowledge_unit_id -&gt; raw_KU</text>
    <text x="10" y="93" font-size="11" fill="white">text_content (3-5 lines, SPLIT)</text>
    <text x="10" y="108" font-size="11" fill="white">text_length, line_count, page_number</text>
    <text x="10" y="123" font-size="11" fill="white">position (x, y, width, height)</text>
    <text x="10" y="138" font-size="11" fill="white">language, confidence_score</text>
    <text x="10" y="153" font-size="11" fill="white">chapter, topic, sub_topic</text>
    <text x="10" y="168" font-size="11" fill="white">verified, verified_at, verified_by</text>
    <text x="10" y="188" font-size="11" font-weight="bold" fill="white">System-Reserved Attributes (1-8)</text>
    <text x="10" y="203" font-size="10" fill="white">  attr1: related_image</text>
    <text x="10" y="216" font-size="10" fill="white">  attr2-4: OCR text (SPLIT from raw)</text>
    <text x="10" y="229" font-size="10" fill="white">  attr5-7: OCR confidence scores</text>
    <text x="10" y="242" font-size="10" fill="white">  attr8: record_status (enabled/disabled)</text>
    <text x="10" y="260" font-size="11" font-weight="bold" fill="white">User-Defined Attributes (9-40)</text>
    <text x="10" y="280" font-size="11" font-weight="bold" fill="white">Merge/Split:</text>
    <text x="10" y="295" font-size="10" fill="white">  FK: merged_into_record_id -&gt; self</text>
    <text x="10" y="308" font-size="10" fill="white">  original_record_ids (array)</text>
    <text x="10" y="323" font-size="11" fill="white">notes, tags, linked_image_ids</text>
    <text x="10" y="338" font-size="11" fill="white">embedding (vector 384), timestamps</text>
  </g>

  <!-- FK: knowledge_units -> raw_knowledge_units -->
  <path d="M 900,560 L 870,560 L 870,600 L 830,600"
        stroke="#E74C3C" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="840" y="598" font-size="9" fill="#E74C3C">raw_knowledge_unit_id</text>

  <!-- Self-referencing FK for knowledge_units -->
  <path d="M 900,750 L 870,750 L 870,650 L 900,650"
        stroke="#E74C3C" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="875" y="700" font-size="9" fill="#E74C3C" transform="rotate(-90, 875, 700)">merged_into</text>

  <!-- 5. pages (Processed - Left Bottom) -->
  <g transform="translate(50, 760)">
    <rect width="350" height="180" fill="#7ED321" stroke="#5A9818" stroke-width="3" rx="8"/>
    <rect width="350" height="40" fill="#5A9818" rx="8"/>
    <text x="175" y="27" text-anchor="middle" font-size="15" font-weight="bold" fill="white">
      book{N}_{name}_pages
    </text>
    <text x="10" y="60" font-size="12" font-weight="bold" fill="white">PK: id</text>
    <text x="10" y="78" font-size="11" fill="white">FK: raw_page_id -&gt; raw_pages</text>
    <text x="10" y="93" font-size="11" fill="white">page_number (unique)</text>
    <text x="10" y="108" font-size="11" fill="white">green_rectangles (JSONB)</text>
    <text x="10" y="123" font-size="11" fill="white">orange_rectangles (JSONB)</text>
    <text x="10" y="138" font-size="11" fill="white">marker_generated, marker_generated_at</text>
    <text x="10" y="153" font-size="11" fill="white">created_at, updated_at</text>
    <text x="10" y="170" font-size="10" font-style="italic" fill="white">Rectangles only (image in raw_pages)</text>
  </g>

  <!-- FK: pages -> raw_pages -->
  <path d="M 225,760 L 225,730 L 225,700 L 225,690"
        stroke="#E74C3C" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="230" y="735" font-size="9" fill="#E74C3C">raw_page_id</text>

  <!-- 6. images (Processed - Center Bottom) -->
  <g transform="translate(450, 950)">
    <rect width="320" height="200" fill="#7ED321" stroke="#5A9818" stroke-width="3" rx="8"/>
    <rect width="320" height="40" fill="#5A9818" rx="8"/>
    <text x="160" y="27" text-anchor="middle" font-size="15" font-weight="bold" fill="white">
      book{N}_{name}_images
    </text>
    <text x="10" y="60" font-size="12" font-weight="bold" fill="white">PK: id</text>
    <text x="10" y="78" font-size="11" fill="white">image_id (e.g., IMG-068), page_number</text>
    <text x="10" y="93" font-size="11" fill="white">image_data (BYTEA), thumbnail_data</text>
    <text x="10" y="108" font-size="11" fill="white">image_format, dimensions, file_size</text>
    <text x="10" y="123" font-size="11" fill="white">position (x, y, w, h)</text>
    <text x="10" y="138" font-size="11" fill="white">ai_description, structured_json</text>
    <text x="10" y="153" font-size="11" fill="white">image_type, confidence_score</text>
    <text x="10" y="168" font-size="11" fill="white">tags, caption, figure_number</text>
    <text x="10" y="183" font-size="11" fill="white">linked_text_ids, embedding (vector 512)</text>
  </g>

  <!-- 7. processing_state (Processed - Right Bottom Row 1) -->
  <g transform="translate(820, 950)">
    <rect width="280" height="140" fill="#7ED321" stroke="#5A9818" stroke-width="3" rx="8"/>
    <rect width="280" height="40" fill="#5A9818" rx="8"/>
    <text x="140" y="27" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      book{N}_{name}_processing_state
    </text>
    <text x="10" y="58" font-size="11" font-weight="bold" fill="white">PK: id = 1 (single row)</text>
    <text x="10" y="75" font-size="10" fill="white">status, current_page, total_pages</text>
    <text x="10" y="90" font-size="10" fill="white">progress_percentage, checkpoint info</text>
    <text x="10" y="105" font-size="10" fill="white">agent_states (JSONB), statistics</text>
    <text x="10" y="120" font-size="10" fill="white">timestamps, error tracking</text>
  </g>

  <!-- 8. settings (Processed - Right Bottom Row 2) -->
  <g transform="translate(1140, 950)">
    <rect width="250" height="140" fill="#7ED321" stroke="#5A9818" stroke-width="3" rx="8"/>
    <rect width="250" height="40" fill="#5A9818" rx="8"/>
    <text x="125" y="27" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      book{N}_{name}_settings
    </text>
    <text x="10" y="58" font-size="11" font-weight="bold" fill="white">PK: id = 1 (single row)</text>
    <text x="10" y="75" font-size="10" fill="white">special_instructions</text>
    <text x="10" y="90" font-size="10" fill="white">language_setting, sensitivity</text>
    <text x="10" y="105" font-size="10" fill="white">OCR settings, image settings</text>
    <text x="10" y="120" font-size="10" fill="white">checkpoint_frequency</text>
  </g>

  <!-- 9. hierarchy (Processed - Right Bottom Row 3) -->
  <g transform="translate(820, 1120)">
    <rect width="280" height="140" fill="#7ED321" stroke="#5A9818" stroke-width="3" rx="8"/>
    <rect width="280" height="40" fill="#5A9818" rx="8"/>
    <text x="140" y="27" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      book{N}_{name}_hierarchy
    </text>
    <text x="10" y="58" font-size="11" font-weight="bold" fill="white">PK: id</text>
    <text x="10" y="75" font-size="10" fill="white">FK: parent_id -&gt; self</text>
    <text x="10" y="90" font-size="10" fill="white">level (1=chapter, 2=topic, 3=subtopic)</text>
    <text x="10" y="105" font-size="10" fill="white">name, page_start, page_end</text>
    <text x="10" y="120" font-size="10" fill="white">order_index, auto_detected</text>
  </g>

  <!-- 10. attribute_keys (Processed - Right Bottom Row 4) -->
  <g transform="translate(1140, 1120)">
    <rect width="250" height="160" fill="#7ED321" stroke="#5A9818" stroke-width="3" rx="8"/>
    <rect width="250" height="40" fill="#5A9818" rx="8"/>
    <text x="125" y="27" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      book{N}_{name}_attribute_keys
    </text>
    <text x="10" y="58" font-size="11" font-weight="bold" fill="white">PK: id</text>
    <text x="10" y="75" font-size="10" fill="white">attr_number (1-40, unique)</text>
    <text x="10" y="90" font-size="10" fill="white">key_name (e.g., "Difficulty Level")</text>
    <text x="10" y="105" font-size="10" fill="white">is_system_reserved (1-8: TRUE)</text>
    <text x="10" y="120" font-size="10" fill="white">is_editable (9-40: TRUE)</text>
    <text x="10" y="135" font-size="10" fill="white">description, placeholder_example</text>
  </g>

  <!-- Data Flow Annotation -->
  <g transform="translate(50, 1350)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#333">Data Flow:</text>
    <text x="0" y="25" font-size="13" fill="#666">1. PDF -&gt; raw_pages (original images)</text>
    <text x="0" y="45" font-size="13" fill="#666">2. raw_pages -&gt; OCR Engines -&gt; raw_knowledge_units (full page text x 3 engines)</text>
    <text x="0" y="65" font-size="13" fill="#666">3. User clicks "Evaluate, Split &amp; Mark"</text>
    <text x="0" y="85" font-size="13" fill="#666">4. raw_knowledge_units -&gt; knowledge_units (split 3-5 line records)</text>
    <text x="0" y="105" font-size="13" fill="#666">5. knowledge_units -&gt; pages (generate green/orange rectangles)</text>
  </g>

  <!-- Storage Benefits -->
  <g transform="translate(650, 1350)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#333">Storage Benefits:</text>
    <text x="0" y="25" font-size="13" fill="#5A9818">- Page images stored ONCE in raw_pages</text>
    <text x="0" y="45" font-size="13" fill="#5A9818">- Can re-split without re-running OCR</text>
    <text x="0" y="65" font-size="13" fill="#5A9818">- Full traceability: raw -&gt; processed</text>
    <text x="0" y="85" font-size="13" fill="#5A9818">- Compare all 3 OCR results preserved</text>
  </g>

  <!-- CHROMA VECTOR DATABASE SECTION -->
  <text x="1200" y="450" font-size="16" font-weight="bold" fill="#6C3483">CHROMA VECTOR DATABASE</text>

  <!-- Chroma DB - Unified Collection -->
  <g transform="translate(1200, 480)">
    <rect width="550" height="240" fill="#9B59B6" stroke="#6C3483" stroke-width="3" rx="8"/>
    <rect width="550" height="40" fill="#6C3483" rx="8"/>
    <text x="275" y="27" text-anchor="middle" font-size="15" font-weight="bold" fill="white">
      knowledge_base_unified
    </text>

    <!-- Collection Description -->
    <text x="10" y="60" font-size="11" font-weight="bold" fill="white">Single Collection: ALL Books + Text + Images</text>

    <text x="10" y="85" font-size="11" fill="white">DOCUMENT (gets embedded):</text>
    <text x="25" y="100" font-size="10" fill="white">Text: Full text from knowledge_units.text</text>
    <text x="25" y="113" font-size="10" fill="white">Images: Full AI description from images.ai_description</text>

    <text x="10" y="135" font-size="11" fill="white">METADATA (14 fields):</text>
    <text x="25" y="150" font-size="10" fill="white">entity_type, table_name, postgresql_id, preview</text>
    <text x="25" y="163" font-size="10" fill="white">page_number, chapter, topic, verified, language</text>
    <text x="25" y="176" font-size="10" fill="white">tags, book_id, book_name, cross-entity links</text>

    <!-- Purpose -->
    <text x="10" y="200" font-size="11" font-style="italic" fill="white">Cross-book semantic search</text>
    <text x="10" y="215" font-size="10" fill="white">PostgreSQL = Source of Truth | Chroma = Fast Vector Search</text>
  </g>

  <!-- Sync Arrows: knowledge_units and images -> Chroma -->
  <path d="M 1150,950 L 1180,950 L 1180,630 L 1200,630"
        stroke="#9B59B6" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>
  <text x="1155" y="790" font-size="9" fill="#9B59B6" transform="rotate(-90, 1155, 790)">Text Sync</text>

  <path d="M 1150,1100 L 1180,1100 L 1180,660 L 1200,660"
        stroke="#9B59B6" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>
  <text x="1155" y="880" font-size="9" fill="#9B59B6" transform="rotate(-90, 1155, 880)">Image Sync</text>

  <!-- Footer -->
  <text x="900" y="1570" text-anchor="middle" font-size="12" fill="#999">
    Knowledge Extraction System | PostgreSQL 15+ with pgvector (10 Tables) + Chroma DB (Unified Collection)
  </text>
</svg>
